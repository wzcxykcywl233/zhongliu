[workspace]
authors = ["Felix Knispel <felix.knispel@virdx.com>"]
channels = ["conda-forge"]
name = "cotracker-algorithm"
platforms = ["osx-arm64", "linux-64"]
version = "0.1.0"

[tasks]

[environments]
default = ["cpu"]
cuda = ["cuda"]

[dependencies]
python = ">=3.10.18,<3.14"
ruff = ">=0.12.12,<0.13"
pytest = ">=8.4.2,<9"
matplotlib = ">=3.10.6,<4"
numpy = ">=2.2.6,<3"
scikit-image = ">=0.25.2,<0.26"
nibabel = ">=5.3.2,<6"
simpleitk = ">=2.4.1,<3"

[pypi-dependencies]
cotracker = { path="./ext/co-tracker", editable=false }
opencv-python = ">=4.11.0.86, <5"

[feature.cpu]
platforms = ["linux-64", "osx-arm64"]

[feature.cpu.dependencies]
pytorch-cpu = "*"

[feature.cuda]
platforms = ["linux-64"]
system-requirements = { cuda = "12.0" }

[feature.cuda.dependencies]
pytorch-gpu = "*"
